<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly TODO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>

  <!-- ===== Top Bar ===== -->
  <header class="top-bar">
    <div class="top-bar-left">
      <h1 class="logo">☑ Weekly TODO</h1>
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" id="search-input" placeholder="Search tasks… (n = new task)" autocomplete="off" />
      </div>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" onclick="App.importTasks()" title="Import backup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 12l-4-4m4 4l4-4M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" onclick="App.exportTasks()" title="Export backup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4v12m0 0l4-4m-4 4l-4-4M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 12 12)"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Stats Bar ===== -->
  <section class="stats-bar">
    <div class="stat-card">
      <svg class="stat-ring" width="44" height="44" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
        <circle id="stats-progress-ring" cx="40" cy="40" r="36" fill="none" stroke="var(--accent)" stroke-width="6"
                stroke-linecap="round" transform="rotate(-90 40 40)"
                style="transition: stroke-dashoffset .6s ease"/>
      </svg>
      <span id="stats-progress-text" class="stat-ring-text">0%</span>
    </div>
    <div class="stat-item"><span class="stat-value" id="stats-total">0</span><span class="stat-label">Total</span></div>
    <div class="stat-item"><span class="stat-value" id="stats-done">0</span><span class="stat-label">Done</span></div>
    <div class="stat-item"><span class="stat-value stat-overdue" id="stats-overdue">0</span><span class="stat-label">Late Due</span></div>
    <div class="stat-item"><span class="stat-value" id="stats-today">0/0</span><span class="stat-label">Today</span></div>
    <div class="stat-item"><span class="stat-value" id="stats-today-est">0m</span><span class="stat-label">Today Est.</span></div>
  </section>

  <!-- ===== Week Navigation ===== -->
  <nav class="week-nav">
    <button class="nav-btn" onclick="App.shiftWeek(-1)" title="Previous week">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-today-btn" onclick="App.goToThisWeek()">Today</button>
    <button id="summary-toggle" class="nav-summary-btn" onclick="App.toggleSummary()">📊 Summary</button>
    <span id="week-label" class="week-label"></span>
    <button class="nav-btn" onclick="App.shiftWeek(1)" title="Next week">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <!-- ===== Week Grid ===== -->
  <main class="week-grid">
    <div id="week-container" class="week-container"></div>

    <!-- ===== Sidebar: Deadlines + Backlog ===== -->
    <div class="sidebar">
      <!-- Deadlines Panel -->
      <aside id="deadlines-panel" class="deadlines-panel">
        <div class="deadlines-header">
          <h2>📅 Deadlines</h2>
          <span id="deadlines-count" class="deadlines-count">0 deadlines</span>
        </div>
        <div id="deadlines-tasks" class="deadlines-tasks"></div>
      </aside>

      <!-- Backlog Panel -->
      <aside id="backlog-panel" class="backlog-panel">
        <div class="backlog-header">
          <h2>📋 Backlog</h2>
          <span id="backlog-count" class="backlog-count">0 tasks</span>
          <span id="backlog-estimate" class="backlog-estimate">0m</span>
        </div>
        <div id="backlog-tasks" class="backlog-tasks"></div>
        <div class="quick-add backlog-quick-add">
          <button class="add-task-btn backlog-add" onclick="App.startBacklogQuickAdd(this)" title="Add to backlog">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Add to backlog</span>
          </button>
        </div>
      </aside>
    </div>
  </main>

  <!-- ===== Task Modal ===== -->
  <div id="task-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button class="modal-close" onclick="App.closeModal()">×</button>
      </div>
      <form id="task-form" class="task-form">
        <div class="form-group">
          <label for="task-title-input">Title *</label>
          <input type="text" id="task-title-input" required placeholder="What needs to be done?" maxlength="200" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-assigned-date">Assigned Day</label>
            <input type="date" id="task-assigned-date" />
          </div>
          <div class="form-group">
            <label for="task-deadline">📅 Due Date <small>(assignment / hand-in)</small></label>
            <input type="date" id="task-deadline" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-estimate">Estimate (min)</label>
            <input type="number" id="task-estimate" min="0" max="1440" placeholder="30" />
          </div>
          <div class="form-group">
            <label for="task-category-input">Category</label>
            <input type="text" id="task-category-input" placeholder="e.g. Work, Personal, Study…" maxlength="50" list="category-datalist" autocomplete="off" />
            <datalist id="category-datalist"></datalist>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Toast Container ===== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ===== Keyboard Shortcut Hint ===== -->
  <footer class="shortcut-bar">
    <span><kbd>N</kbd> New task</span>
    <span><kbd>←</kbd><kbd>→</kbd> Navigate weeks</span>
    <span><kbd>Esc</kbd> Close modal</span>
    <span>Drag tasks between days</span>
  </footer>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
